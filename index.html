<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    <title>Troll Mods | Скрипты Roblox | Читы Oxide и Free Fire (скоро)</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --bg: #030408;
            --card-bg: rgba(15, 18, 28, 0.9);
            --border: rgba(255, 255, 255, 0.06);
            --text: #e8ecf1;
            --muted: #8b92a5;
            --accent: #b300ff;
            --green: #10b981;
            --tg-blue: #2aabee;
            --red: #ef4444;
            --gold: #f59e0b;
            --orange: #ff8c00;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Segoe UI', 'Roboto', system-ui, -apple-system, sans-serif;
            background: var(--bg); color: var(--text);
            min-height: 100vh; overflow-x: hidden; position: relative; line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        /* АНИМИРОВАННЫЙ ФОН */
        .animated-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -3;
            background: radial-gradient(ellipse at 30% 40%, #140a24 0%, #030408 55%);
            animation: bgPulse 8s ease-in-out infinite;
        }
        @keyframes bgPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.9; }
        }
        .animated-bg::after {
            content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2;
            background: radial-gradient(ellipse at 70% 60%, #0a1a24 0%, transparent 50%);
            animation: bgShift 10s ease-in-out infinite;
        }
        @keyframes bgShift {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(2%, 2%); }
        }
        .grid-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; opacity: 0.4;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridMove 25s linear infinite;
        }
        @keyframes gridMove { 0% { transform: translate(0, 0); } 100% { transform: translate(50px, 50px); } }

        .particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
        .particle {
            position: absolute; background: rgba(180, 0, 255, 0.2); border-radius: 50%;
            filter: blur(5px); animation: float linear infinite;
        }
        @keyframes float {
            0% { transform: translateY(110vh) scale(0); opacity: 0; } 
            10% { opacity: 1; } 
            90% { opacity: 0.6; } 
            100% { transform: translateY(-20vh) scale(1.6); opacity: 0; }
        }

        .app { max-width: 1100px; margin: 0 auto; padding: 0 1.5rem 2rem; display: flex; flex-direction: column; min-height: 100vh; position: relative; z-index: 2; }

        /* ШАПКА С АНИМАЦИЕЙ */
        header { padding: 2.5rem 0 1rem; text-align: center; position: relative; }
        .logo-main {
            font-size: clamp(3rem, 9vw, 5rem); font-weight: 900; letter-spacing: 5px;
            background: linear-gradient(135deg, #00f2fe, #b300ff, #ff006e);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
            filter: drop-shadow(0 0 40px rgba(179, 0, 255, 0.7)); margin-bottom: 0.5rem; line-height: 1.1;
            animation: logoGlow 3s ease-in-out infinite;
        }
        @keyframes logoGlow {
            0%, 100% { filter: drop-shadow(0 0 40px rgba(179, 0, 255, 0.7)); }
            50% { filter: drop-shadow(0 0 60px rgba(0, 242, 254, 0.9)); }
        }
        .tagline {
            color: var(--muted); font-size: 1.3rem; font-weight: 500;
            display: flex; align-items: center; justify-content: center; gap: 0.8rem; flex-wrap: wrap; letter-spacing: 1px;
            animation: fadeInUp 1s ease-out;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* БЛОК ПРИВЕТСТВИЯ С АНИМАЦИЯМИ */
        .welcome-section {
            background: var(--card-bg); backdrop-filter: blur(25px); border: 1px solid var(--border);
            border-radius: 3rem; padding: 2.5rem; margin: 2rem 0; text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.6); position: relative; overflow: hidden;
            animation: slideIn 0.8s ease-out;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .welcome-section::before {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(179,0,255,0.08) 0%, transparent 70%);
            animation: welcomeGlow 6s ease-in-out infinite;
        }
        @keyframes welcomeGlow {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(5%, 5%); }
        }
        .welcome-avatar {
            width: 90px; height: 90px; border-radius: 50%; margin: 0 auto 1.5rem;
            background: linear-gradient(135deg, #b300ff, #00f2fe); display: flex; align-items: center;
            justify-content: center; font-size: 2.5rem; color: white;
            box-shadow: 0 15px 30px rgba(179, 0, 255, 0.5); position: relative; z-index: 1;
            animation: avatarPulse 2s ease-in-out infinite;
        }
        @keyframes avatarPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }
        .welcome-section h2 {
            font-size: 2rem; font-weight: 800; margin-bottom: 1rem; position: relative; z-index: 1;
            animation: textGlow 2s ease-in-out infinite;
        }
        @keyframes textGlow {
            0%, 100% { text-shadow: 0 0 20px rgba(0,242,254,0.5); }
            50% { text-shadow: 0 0 40px rgba(0,242,254,0.9); }
        }
        .welcome-section h2 span { color: #00f2fe; }
        .welcome-section .welcome-text {
            color: var(--muted); font-size: 1.1rem; line-height: 1.8; position: relative; z-index: 1;
            max-width: 700px; margin: 0 auto 1.5rem;
        }
        .welcome-stats {
            display: flex; justify-content: center; gap: 2rem; flex-wrap: wrap;
            position: relative; z-index: 1;
        }
        .welcome-stat {
            text-align: center;
            animation: countUp 1s ease-out;
        }
        @keyframes countUp {
            from { opacity: 0; transform: scale(0.5); }
            to { opacity: 1; transform: scale(1); }
        }
        .welcome-stat .stat-number {
            font-size: 2rem; font-weight: 900; color: #00f2fe;
            animation: numberGlow 1.5s ease-in-out infinite;
        }
        @keyframes numberGlow {
            0%, 100% { text-shadow: 0 0 10px rgba(0,242,254,0.5); }
            50% { text-shadow: 0 0 25px rgba(0,242,254,0.9); }
        }
        .welcome-stat .stat-label {
            font-size: 0.85rem; color: var(--muted);
        }

        /* НАВИГАЦИЯ С АНИМАЦИЕЙ */
        nav {
            display: flex; justify-content: center; flex-wrap: wrap; gap: 0.5rem; margin: 2rem 0 1.5rem;
            background: rgba(15, 18, 30, 0.8); backdrop-filter: blur(20px); padding: 0.6rem;
            border-radius: 60px; border: 1px solid var(--border); position: sticky; top: 1rem; z-index: 10;
            animation: navSlideDown 0.6s ease-out;
        }
        @keyframes navSlideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .nav-btn {
            background: transparent; border: none; color: #cbd5e1; padding: 0.7rem 1.5rem;
            border-radius: 40px; font-weight: 700; font-size: 0.95rem; cursor: pointer;
            transition: all 0.3s ease; display: flex; align-items: center; gap: 0.5rem; white-space: nowrap;
            position: relative; overflow: hidden;
        }
        .nav-btn::after {
            content: ''; position: absolute; top: 50%; left: 50%; width: 0; height: 0;
            background: rgba(255,255,255,0.1); border-radius: 50%; transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }
        .nav-btn:hover::after {
            width: 300px; height: 300px;
        }
        .nav-btn i { font-size: 1rem; position: relative; z-index: 1; }
        .nav-btn:hover { background: rgba(255, 255, 255, 0.08); color: white; transform: translateY(-2px); }
        .nav-btn.active { 
            background: linear-gradient(135deg, #b300ff, #7d00cc); color: white; 
            box-shadow: 0 8px 25px rgba(179, 0, 255, 0.5);
            animation: activeBtn 0.5s ease-out;
        }
        @keyframes activeBtn {
            from { transform: scale(0.9); }
            to { transform: scale(1); }
        }

        /* СТРАНИЦЫ С АНИМАЦИЕЙ */
        .page { display: none; }
        .page.active { display: block; animation: pageIn 0.5s ease-out; }
        @keyframes pageIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .section-title {
            font-size: 2rem; font-weight: 800; margin: 1.5rem 0 1.5rem;
            display: flex; align-items: center; gap: 0.8rem; flex-wrap: wrap;
            animation: titleSlide 0.6s ease-out;
        }
        @keyframes titleSlide {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .section-title span { 
            background: var(--accent); padding: 0.3rem 1.2rem; border-radius: 30px; font-size: 0.9rem; color: white;
            animation: badgePop 0.5s ease-out;
        }
        @keyframes badgePop {
            from { transform: scale(0); }
            to { transform: scale(1); }
        }

        /* СЕТКИ С АНИМАЦИЕЙ */
        .scripts-grid, .chits-grid {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 2rem; margin-bottom: 2.5rem;
        }
        .card {
            background: var(--card-bg); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--border); border-radius: 3rem; padding: 2.2rem;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.8);
            display: flex; flex-direction: column; text-align: center;
            animation: cardAppear 0.6s ease-out;
        }
        @keyframes cardAppear {
            from { opacity: 0; transform: scale(0.9) translateY(30px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .card:nth-child(1) { animation-delay: 0.1s; }
        .card:nth-child(2) { animation-delay: 0.2s; }
        .card:nth-child(3) { animation-delay: 0.3s; }
        .card:nth-child(4) { animation-delay: 0.4s; }
        .card:hover { 
            transform: translateY(-12px) scale(1.02); 
            border-color: rgba(179, 0, 255, 0.5); 
            box-shadow: 0 35px 65px rgba(179, 0, 255, 0.4); 
        }

        /* ФОТО-ПРЕВЬЮ С АНИМАЦИЕЙ */
        .script-photo {
            width: 100%; aspect-ratio: 16/9; border-radius: 2rem; margin-bottom: 1.8rem;
            position: relative; overflow: hidden; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
            display: flex; align-items: center; justify-content: center;
            transition: all 0.5s ease;
        }
        .script-photo:hover {
            transform: scale(1.03);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.9);
        }
        .script-photo.pickaxe { background: linear-gradient(145deg, #4a3520, #1f1a0e); border: 1px solid rgba(245, 158, 11, 0.4); }
        .script-photo.slime { background: linear-gradient(145deg, #1f4a35, #0e1f1a); border: 1px solid rgba(16, 185, 129, 0.4); }
        .script-photo.oxide { background: linear-gradient(145deg, #4a3a1f, #1f1a0e); border: 1px solid rgba(255, 140, 0, 0.4); }
        .script-photo.freefire { background: linear-gradient(145deg, #4a1f1f, #1f0e0e); border: 1px solid rgba(255, 84, 0, 0.4); }
        .script-photo i { 
            font-size: 5.5rem; color: rgba(255, 255, 255, 0.2); 
            filter: drop-shadow(0 8px 12px rgba(0,0,0,0.8));
            animation: iconFloat 3s ease-in-out infinite;
        }
        @keyframes iconFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        .script-photo .photo-badge {
            position: absolute; bottom: 15px; right: 15px;
            background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(10px);
            padding: 0.5rem 1.2rem; border-radius: 30px; font-size: 0.85rem; font-weight: 700; color: white; letter-spacing: 0.5px;
            animation: badgeSlide 0.8s ease-out;
        }
        @keyframes badgeSlide {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .script-photo .photo-icon-large { 
            position: absolute; top: 15px; left: 15px; font-size: 1.8rem; color: rgba(255, 255, 255, 0.6);
            animation: starRotate 4s linear infinite;
        }
        @keyframes starRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .card h2 { font-size: 1.9rem; margin-bottom: 0.8rem; font-weight: 800; }
        .card .desc { color: var(--muted); font-size: 1.05rem; margin-bottom: 1.5rem; line-height: 1.7; }
        .features-list {
            list-style: none; margin: 0 0 1.8rem; flex: 1; display: flex; flex-direction: column; gap: 0.6rem; text-align: left;
        }
        .features-list li {
            display: flex; align-items: flex-start; gap: 0.7rem; font-size: 0.95rem;
            background: rgba(255, 255, 255, 0.03); padding: 0.6rem 1rem;
            border-radius: 14px; border: 1px solid rgba(255,255,255,0.04);
            transition: all 0.3s ease;
            animation: listItemIn 0.5s ease-out;
        }
        @keyframes listItemIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .features-list li:nth-child(1) { animation-delay: 0.1s; }
        .features-list li:nth-child(2) { animation-delay: 0.15s; }
        .features-list li:nth-child(3) { animation-delay: 0.2s; }
        .features-list li:nth-child(4) { animation-delay: 0.25s; }
        .features-list li:nth-child(5) { animation-delay: 0.3s; }
        .features-list li:nth-child(6) { animation-delay: 0.35s; }
        .features-list li:nth-child(7) { animation-delay: 0.4s; }
        .features-list li:nth-child(8) { animation-delay: 0.45s; }
        .features-list li:nth-child(9) { animation-delay: 0.5s; }
        .features-list li:hover {
            background: rgba(179, 0, 255, 0.08);
            border-color: rgba(179, 0, 255, 0.2);
            transform: translateX(5px);
        }
        .features-list li i { color: var(--green); margin-top: 0.15rem; font-size: 0.9rem; }

        .coming-soon-badge {
            display: inline-block; background: rgba(245, 158, 11, 0.15); color: var(--gold);
            padding: 0.4rem 1.2rem; border-radius: 30px; font-weight: 700; font-size: 0.9rem;
            margin-bottom: 1rem; border: 1px solid rgba(245, 158, 11, 0.3);
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .no-files-badge {
            display: inline-block; background: rgba(239, 68, 68, 0.15); color: var(--red);
            padding: 0.4rem 1.2rem; border-radius: 30px; font-weight: 700; font-size: 0.9rem;
            margin-bottom: 1rem; border: 1px solid rgba(239, 68, 68, 0.3);
            animation: shake 0.5s ease-in-out;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        /* КНОПКИ С АНИМАЦИЯМИ */
        .btn-group { display: flex; gap: 0.8rem; flex-wrap: wrap; }
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 0.6rem;
            padding: 0.9rem 1.6rem; border-radius: 50px; font-weight: 700; text-decoration: none;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            border: none; cursor: pointer; font-size: 1rem; flex: 1;
            white-space: nowrap; letter-spacing: 0.3px; position: relative; overflow: hidden;
        }
        .btn::after {
            content: ''; position: absolute; top: 50%; left: 50%; width: 0; height: 0;
            background: rgba(255,255,255,0.2); border-radius: 50%; transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }
        .btn:hover::after {
            width: 300px; height: 300px;
        }
        .btn-dl { 
            background: linear-gradient(135deg, #10b981, #059669); color: white; 
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.3);
            animation: btnGlow 2s ease-in-out infinite;
        }
        @keyframes btnGlow {
            0%, 100% { box-shadow: 0 8px 20px rgba(16, 185, 129, 0.3); }
            50% { box-shadow: 0 12px 30px rgba(16, 185, 129, 0.6); }
        }
        .btn-dl:hover { box-shadow: 0 14px 35px rgba(16, 185, 129, 0.6); transform: translateY(-3px) scale(1.03); }
        .btn-tg { 
            background: linear-gradient(135deg, #0088cc, #2aabee); color: white; 
            box-shadow: 0 8px 20px rgba(0, 136, 204, 0.3);
            animation: btnGlowTg 2s ease-in-out infinite;
        }
        @keyframes btnGlowTg {
            0%, 100% { box-shadow: 0 8px 20px rgba(0, 136, 204, 0.3); }
            50% { box-shadow: 0 12px 30px rgba(0, 136, 204, 0.6); }
        }
        .btn-tg:hover { box-shadow: 0 14px 35px rgba(0, 136, 204, 0.6); transform: translateY(-3px) scale(1.03); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; filter: grayscale(0.6); pointer-events: none; animation: none; }

        /* КАНАЛЫ С АНИМАЦИЯМИ */
        .channels-section { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.8rem; margin: 2rem 0; }
        .channel-card {
            background: var(--card-bg); backdrop-filter: blur(25px); border: 1px solid var(--border);
            border-radius: 2.5rem; padding: 2rem; text-align: center; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 25px 40px rgba(0, 0, 0, 0.7);
            animation: cardAppear 0.6s ease-out;
        }
        .channel-card:hover { 
            border-color: rgba(179, 0, 255, 0.5); 
            transform: translateY(-8px) scale(1.02); 
            box-shadow: 0 30px 50px rgba(179, 0, 255, 0.3); 
        }
        .channel-card i { 
            font-size: 2.8rem; margin-bottom: 1rem;
            animation: iconFloat 3s ease-in-out infinite;
        }
        .channel-card h4 { margin-bottom: 0.5rem; font-size: 1.3rem; }
        .channel-card p { color: var(--muted); font-size: 0.95rem; margin-bottom: 1.3rem; }
        .channel-card .btn { width: 100%; }

        /* ДИСКЛЕЙМЕР С АНИМАЦИЕЙ */
        .disclaimer-box {
            background: rgba(239, 68, 68, 0.08); border: 1px solid rgba(239, 68,
